# voicekey config — ~/.config/voicekey/config.toml
# Every key is optional; these are the defaults. Keys are evdev names
# (KEY_RIGHTMETA, KEY_RIGHTALT+KEY_F23, ...). The compositor must not act on them —
# see README "Install".

dictate_key = "KEY_RIGHTMETA" # Right Win/Super: hold to dictate; tap to keep listening; press again to stop
agent_key   = "KEY_RIGHTALT+KEY_RIGHTMETA" # hold Right Alt, then Right Win; release to send to the agent; tap to open it
dictate_toggle_key = ""    # optional: first press starts, second press stops
agent_toggle_key   = ""
language    = "en"
tap_seconds = 0.25         # releases before this are taps; shorter recordings are dropped
max_seconds = 90.0         # single-recording cap (agent/stdout/replay); dictation uses batch limits
recordings_dir = ""        # debug: keep wav + live/final transcripts of every recording

[backend]                  # final pass over each dictation batch
type = "parakeet"          # "parakeet" (CPU, sherpa-onnx) | "faster-whisper" (CUDA)
model_dir = "~/.local/share/voicekey/sherpa-onnx-nemo-parakeet-unified-en-0.6b-int8-non-streaming"
# faster-whisper only:
# model = "large-v3-turbo"
# device = "cuda"
# compute_type = "float16"

[streaming]                # live preview while the key is held; "" disables it
model_dir = "~/.local/share/voicekey/sherpa-onnx-nemotron-speech-streaming-en-0.6b-560ms-int8-2026-04-25"

[persistent]
draft = false             # experimental: use drafts where supported; ordinary dictation elsewhere
# The DMS Draft mode toggle overrides this default until daemon restart.
draft_cancel_key = "KEY_ESC" # only cancels draft sessions; configurable chord, e.g. "KEY_LEFTCTRL+KEY_ESC"
# An actual draft makes the dictation key a toggle: start, then accept. It always
# pauses on window switches, retaining the original buffer. Silence/free-memory
# stops also await accept/cancel. The cancel key still reaches the application.
# Draft accept/cancel hotkeys require the original window; widget controls do not.
destination_policy = "pause" # "pause" on window switch (default), "follow" (Niri), or "pin"
key = ""                  # optional extra toggle, e.g. "KEY_F11"; the dictation hotkey already uses this engine
vad_model = "~/.local/share/voicekey/silero_vad.onnx" # --download fetches it for dictation
pause_seconds = 1.2        # silence that finishes an utterance; microphone keeps running
silence_seconds = 60.0    # longer silence turns listening off; key or panel starts it again
max_utterance_seconds = 30.0 # hard cut even during continuous speech
pre_roll_seconds = 0.3     # retain this much audio before detected speech
delivery_seconds = 5.0     # one insertion operation; queued text has no insertion-age expiry
polish_min_words = 0        # all dictation batches; independent of [polish] min_words
polish_context = true      # read-only previous delivered batch; false disables context
drop_filler_only = true     # omit whole utterances of um/uh/er/etc.; raw text remains journalled

[dictation]
post_transcription_hook = "" # optional trusted shell command; stdin -> stdout, at most 5s
ime = true                 # live text and final commit through the Wayland input method
inject = "wtype"           # when the focused app has no text-input support:
                           # "wtype" (type it) | "clipboard" (copy it and say so)
                           # Persistent dictation requires a verified field; the panel offers
                           # simulated typing explicitly for one session in one window.
max_delay_seconds = 10.0   # insertion deadline from key release; expired text is saved/copied
require_same_window = true # verify window before generic delivery (Emacs uses its pinned buffer)
multiline_apps = []        # exact app IDs of checked text composers; IME only,
                          # and only fields reporting ordinary multiline text
                          # Emacs buffers preserve formatting without this setting

[pipeline]
max_pending = 8            # capture/transcription/dictation limit; agent dispatch has the same separate cap
max_audio_seconds = 180.0  # must be >= max_seconds; admission reserves a full recording
transcription_seconds = 30.0 # native inference deadline, also within dictation's delivery budget
shutdown_seconds = 10.0    # drain time; bounded resource cleanup follows
journal_seconds = 3.0      # storage operation deadline; failure disables new capture
recovery_megabytes = 256   # unresolved audio/text quota; recover or remove files when full
history_days = 7           # successful text retention; may be shortened to make room

[polish]                   # third pass: a language model cleans the transcript before it lands
backend = "none"           # "none" | "openai" (any OpenAI-compatible chat endpoint: llama-server,
                           # Ollama, vLLM — local or on another host)
url = "http://127.0.0.1:8642/v1"
model = "s1-mini"          # name sent in requests (llama-server ignores it; Ollama needs it)
format = "s1-mini"         # "s1-mini": the fixed prompt S1-mini by Superwhisper was trained on
                           # "instruct": our own prompt (prompt_file, or the built-in one), any model
style = "semi-formal"      # s1-mini: casual | semi-casual | semi-formal | formal
app_styles = {}            # exact app IDs, e.g. { "org.signal.Signal" = "semi-casual" }
prompt_file = ""           # instruct only: replaces the built-in prompt; {style} is filled in
api_key_file = ""          # for a server that is not voicekey's own (its child gets a fresh key)
timeout_seconds = 10.0     # one request
max_wait_seconds = 4.0     # past this the raw transcript lands unchanged
min_words = 8              # stdout/ordinary replay; dictation uses persistent.polish_min_words
[polish.server]            # llama-server run by voicekey as a child process, when model_file is set
command = "~/.local/share/voicekey/llama.cpp/llama-server"  # install.sh fetches it; or one on PATH
model_file = ""            # e.g. "~/.local/share/voicekey/s1-mini-q4_k_m.gguf" (install.sh fetches it)
threads = 4
context = 2048

[agent]
post_transcription_hook = "" # separate from dictation; runs before agent dispatch
# Hermes lives in its own tmux server, independent of the editor and of
# voicekey. The agent key opens a terminal only if none is attached (a tap
# also raises it on niri); closing
# it detaches without killing Hermes or losing its conversation.
target = "hermes"
# Alternative: one local process per prompt, exact UTF-8 transcript on stdin.
# target = "command"
# command = ["/absolute/path/to/agent-wrapper", "--read-stdin"]
# Set working_directory below to an existing project directory for command mode.
# Arguments are literal (no shell or {text} substitution); output is discarded.
# command_timeout bounds the process; ready_timeout bounds the whole dispatch.
# Wrappers must keep children in the original process group (no daemonizing,
# setsid, or new process groups); detached children escape timeout/cancellation.
transport = "local"
# For a Hermes on another machine over Tailscale:
# transport = "ssh-over-tailscale"
# remote_host = "desktop"
# remote_user = "you"
# identity_file = "~/.ssh/id_ed25519"
tmux_socket = "voicekey-hermes"
tmux_session = "voicekey-hermes"
working_directory = "~/.local/share/voicekey/hermes"  # over ssh, ~/ is the remote user's home
terminal = "ghostty"
terminal_title = "Voicekey Hermes"
open_terminal = true
command_timeout = 10.0
ready_timeout = 300.0      # wait rather than type into a busy/modal/draft TUI

[text.word_overrides]       # optional literal phrases, case-insensitive word boundaries
# "hyper whisper" = "hyprwhspr"
# Longest match wins, replacements do not cascade. Applied after polish,
# before the action's hook. Single letters also require word boundaries.
