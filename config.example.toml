# voicekey config — ~/.config/voicekey/config.toml
# Every key is optional; these are the defaults. Keys are evdev names
# (KEY_F9, KEY_RIGHTALT+KEY_F23, ...). The compositor must not act on them —
# see README "Install".

dictate_key = "KEY_F9"     # hold: speak, release: text lands in the focused field
agent_key   = "KEY_F10"    # hold: speak, release: transcript goes to the agent
dictate_toggle_key = ""    # optional: first press starts, second press stops
agent_toggle_key   = ""
language    = "en"
min_seconds = 0.3          # shorter recordings are accidental taps
max_seconds = 90.0         # stuck-key safety: a longer recording is stopped and transcribed
recordings_dir = ""        # debug: keep wav + live/final transcripts of every recording

[backend]                  # final pass over the whole recording
type = "parakeet"          # "parakeet" (CPU, sherpa-onnx) | "faster-whisper" (CUDA)
model_dir = "~/.local/share/voicekey/sherpa-onnx-nemo-parakeet-unified-en-0.6b-int8-non-streaming"
# faster-whisper only:
# model = "large-v3-turbo"
# device = "cuda"
# compute_type = "float16"

[streaming]                # live preview while the key is held; "" disables it
model_dir = "~/.local/share/voicekey/sherpa-onnx-nemotron-speech-streaming-en-0.6b-560ms-int8-2026-04-25"

[dictation]
ime = true                 # live text and final commit through the Wayland input method
inject = "wtype"           # when the focused app has no text-input support:
                           # "wtype" (type it) | "clipboard" (copy it and say so)
max_delay_seconds = 10.0   # older transcripts are copied, never typed late
require_same_window = true # copy instead if niri focus changed during transcription

[polish]                   # third pass: a language model cleans the transcript before it lands
backend = "none"           # "none" | "openai" (any OpenAI-compatible chat endpoint: llama-server,
                           # Ollama, vLLM — local or on another host)
url = "http://127.0.0.1:8642/v1"
model = "s1-mini"          # name sent in requests (llama-server ignores it; Ollama needs it)
format = "s1-mini"         # "s1-mini": the fixed prompt S1-mini by Superwhisper was trained on
                           # "instruct": our own prompt (prompt_file, or the built-in one), any model
style = "semi-formal"      # s1-mini: casual | semi-casual | semi-formal | formal
prompt_file = ""           # instruct only: replaces the built-in prompt; {style} is filled in
api_key_file = ""          # for a server that is not voicekey's own (its child gets a fresh key)
timeout_seconds = 10.0     # one request
max_wait_seconds = 4.0     # past this the raw transcript lands unchanged
[polish.server]            # llama-server run by voicekey as a child process, when model_file is set
command = "~/.local/share/voicekey/llama.cpp/llama-server"  # install.sh fetches it; or one on PATH
model_file = ""            # e.g. "~/.local/share/voicekey/s1-mini-q4_k_m.gguf" (install.sh fetches it)
threads = 4
context = 2048

[agent]
# Hermes lives in its own tmux server, independent of the editor and of
# voicekey. The agent key opens a terminal only if none is attached; closing
# it detaches without killing Hermes or losing its conversation.
target = "hermes"
transport = "local"
# For a Hermes on another machine over Tailscale:
# transport = "ssh-over-tailscale"
# remote_host = "desktop"
# remote_user = "you"
# identity_file = "~/.ssh/id_ed25519"
tmux_socket = "voicekey-hermes"
tmux_session = "voicekey-hermes"
working_directory = "~/.local/share/voicekey/hermes"  # over ssh, ~/ is the remote user's home
terminal = "ghostty"
terminal_title = "Voicekey Hermes"
open_terminal = true
command_timeout = 10.0
ready_timeout = 300.0      # wait rather than type into a busy/modal/draft TUI
