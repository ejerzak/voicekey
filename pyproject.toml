[project]
name = "voicekey"
version = "0.2.0"
description = "Hold-to-talk dictation for Wayland: live text in the focused field, offline final pass, optional agent dispatch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ethan Jerzak" }]
requires-python = ">=3.11"
dependencies = [
    "evdev>=1.6",
    "numpy",
    "pywayland>=0.4.18",
    "sherpa-onnx>=1.13",
]

[project.optional-dependencies]
# Desktop NVIDIA final pass: faster-whisper on CUDA. The nvidia-* wheels
# provide cuBLAS/cuDNN 9 for ctranslate2 without a system CUDA install; the
# backend preloads them from site-packages at startup.
whisper = [
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["voicekey"]
